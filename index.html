<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal-Sketch</title>
  <style>
    :root {
      --bg: #eef1f6;
      --panel: #ffffff;
      --text: #1f2a44;
      --muted: #5a6580;
      --border: #c9d3e6;
      --accent: #2b3f6b;
      --ok: #1a7f3c;
      --warn: #946200;
      --err: #b42318;
      --control-bg: #ffffff;
      --control-hover: #f0f4fb;
      --paper: #ffffff;
      --paper-dot: #d3dae8;
      --tooltip-fg: #ffffff;
      color-scheme: light;
    }
    /* 自動(data-theme なし)のときは、OSの設定に従う。下の2つのダーク値は同じ内容(テストで一致を確認している) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg: #0f141d;
        --panel: #1a2130;
        --text: #e6ebf7;
        --muted: #a3afc9;
        --border: #3a4660;
        --accent: #8fb0f0;
        --ok: #55c982;
        --warn: #e6b04a;
        --err: #ff8078;
        --control-bg: #232c40;
        --control-hover: #2d3852;
        --paper: #141a26;
        --paper-dot: #2f3a52;
        --tooltip-fg: #141a26;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f141d;
      --panel: #1a2130;
      --text: #e6ebf7;
      --muted: #a3afc9;
      --border: #3a4660;
      --accent: #8fb0f0;
      --ok: #55c982;
      --warn: #e6b04a;
      --err: #ff8078;
      --control-bg: #232c40;
      --control-hover: #2d3852;
      --paper: #141a26;
      --paper-dot: #2f3a52;
      --tooltip-fg: #141a26;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: "Yu Gothic UI", "Meiryo", sans-serif; }
    #toolbar {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    #app-name { font-weight: 700; margin-right: 12px; }
    button {
      font: inherit; padding: 5px 12px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--control-bg); color: var(--text); cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--control-hover); }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    label.toggle { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; }
    .section label.toggle { margin: 0 0 8px; }
    /* 長い文でもツールバーを折り返させない(折り返すとキャンバスが跳ねる)。省略した全文は title に入る */
    #status { flex: 1 1 0; min-width: 8em; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; min-height: 1.4em; }
    #status[data-kind="ok"] { color: var(--ok); }
    #status[data-kind="warn"] { color: var(--warn); }
    #status[data-kind="error"] { color: var(--err); }
    #workspace { display: grid; grid-template-columns: 220px minmax(0, 1fr) 340px; flex: 1 1 0; min-height: 480px; }
    aside { background: var(--panel); overflow-y: auto; padding: 12px; font-size: 13px; }
    #palette { border-right: 1px solid var(--border); }
    #props { border-left: 1px solid var(--border); }
    aside h2 { font-size: 14px; margin: 0 0 6px; }
    aside h3 { font-size: 12px; margin: 14px 0 6px; color: var(--muted); }
    /* 範囲選択の枠(maxGraph の RubberBandHandler が使う)。ポートの枠選択(破線)と見分けやすいよう、実線の薄い塗り */
    .mxRubberband { position: absolute; overflow: hidden; border: 1px solid var(--accent); background: var(--accent); opacity: 0.2; pointer-events: none; z-index: 10; }
    dialog.row-dialog { border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); padding: 16px 20px; min-width: 280px; }
    dialog.row-dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
    .row-dialog-form { display: grid; gap: 10px; }
    .row-dialog-form h2 { font-size: 15px; margin: 0; }
    .dialog-error { color: var(--err); font-size: 12px; margin: 0; min-height: 1.2em; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .hint { color: var(--muted); margin: 0 0 8px; font-size: 12px; }
    .palette-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    .palette-row { display: flex; align-items: stretch; gap: 4px; }
    .palette-item { display: flex; flex: 1 1 auto; min-width: 0; align-items: center; gap: 8px; width: auto; text-align: left; padding: 5px 8px; }
    .palette-remove { flex: 0 0 auto; padding: 3px 7px; color: var(--err); border-color: var(--err); }
    .palette-glyph { display: inline-block; width: 20px; text-align: center; font-size: 18px; line-height: 20px; }
    .section { display: grid; gap: 8px; margin-bottom: 12px; }
    .context-menu { position: fixed; z-index: 1000; min-width: 200px; max-height: calc(100vh - 8px); overflow-y: auto; padding: 4px; display: grid; background: var(--control-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28); }
    .context-menu-item { display: flex; justify-content: space-between; align-items: center; gap: 24px; width: 100%; text-align: left; padding: 6px 10px; border: 0; border-radius: 4px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    .context-menu-item:hover, .context-menu-item:focus-visible { background: var(--control-hover); outline: none; }
    .context-menu-item[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; background: transparent; }
    .context-menu-shortcut { color: var(--muted); font-size: 12px; }
    .context-menu-separator { height: 1px; margin: 4px 2px; background: var(--border); }
    .size-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .button-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .button-row button { padding: 4px 8px; }
    .field { display: grid; gap: 2px; }
    .field-label { font-size: 11px; color: var(--muted); }
    .field input, .field select, .field textarea { font: inherit; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--control-bg); color: var(--text); width: 100%; }
    .field textarea { resize: vertical; box-sizing: border-box; }
    #btn-checks[data-state="warn"] { color: var(--warn); border-color: var(--warn); }
    #btn-checks[data-state="error"] { color: var(--err); border-color: var(--err); }
    @keyframes issue-flash { from { box-shadow: 0 0 0 0 rgba(154, 103, 0, 0.7); } to { box-shadow: 0 0 0 10px rgba(154, 103, 0, 0); } }
    #btn-checks.flash { animation: issue-flash 0.9s ease-out 2; }
    @media (prefers-reduced-motion: reduce) { #btn-checks.flash { animation: none; } }
    .check-item { display: grid; gap: 2px; width: 100%; text-align: left; padding: 6px 8px; margin-bottom: 4px; }
    .check-item.warning { border-left: 4px solid var(--warn); }
    .check-item.error { border-left: 4px solid var(--err); }
    .check-head { font-weight: 600; }
    .check-msg { color: var(--muted); font-size: 12px; }
    /* ポートの飾り(複数接続の外枠・番号の文字)は、操作の対象にしない。子の要素まで、属性より強く打ち消す */
    .port-deco, .port-deco * { pointer-events: none !important; }
    .signal-row { display: grid; grid-template-columns: 32px 1fr auto auto auto auto; gap: 4px; align-items: center; }
    .signal-row .color-input { width: 32px; height: 28px; padding: 0; border: 1px solid var(--border); border-radius: 4px; background: var(--control-bg); }
    .signal-row button { padding: 3px 6px; white-space: nowrap; }
    .signal-row select { font: inherit; padding: 3px 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--control-bg); color: var(--text); min-width: 0; }
    .signal-row input[type="text"] { min-width: 0; }
    /* 凡例の編集: 狭いパネルでも選択欄が切れないよう、1段目(色・色コード・名前・上下)と2段目(線種・親・子を追加・削除)に分ける */
    .legend-row { display: grid; gap: 4px; margin-bottom: 8px; }
    .legend-row-main { display: grid; grid-template-columns: 32px 1fr auto auto; gap: 4px; align-items: center; }
    .legend-row-sub { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 4px; align-items: center; }
    .legend-row .color-input { width: 32px; height: 28px; padding: 0; border: 1px solid var(--border); border-radius: 4px; background: var(--control-bg); }
    .legend-row button { padding: 3px 6px; white-space: nowrap; }
    .legend-row select { font: inherit; padding: 3px 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--control-bg); color: var(--text); min-width: 0; }
    .legend-row input[type="text"] { min-width: 0; }
    .group-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; }
    .group-row .danger { grid-column: 1 / -1; color: var(--err); border-color: var(--err); }
    #stage { padding: 16px; overflow: auto; }
    #canvas-wrap { width: 1280px; max-width: none; box-sizing: content-box; }
    .zoom-group { display: inline-flex; gap: 2px; margin-left: 8px; }
    .zoom-value { min-width: 4.5em; font-variant-numeric: tabular-nums; }
    #graph {
      width: 1280px; height: 720px; position: relative; overflow: hidden;
      background-color: var(--paper); border: 1px solid var(--border);
      background-image: radial-gradient(circle, var(--paper-dot) 1px, transparent 1.2px);
      background-size: 10px 10px;
    }
    #legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 8px 4px; font-size: 12px; color: var(--muted); }
    #legend .item { display: inline-flex; align-items: center; gap: 6px; }
    #legend .swatch { width: 28px; height: 3px; display: inline-block; border-radius: 2px; }
    /* maxGraph のツールチップ。ライブラリのCSSは読み込まないため、位置指定を含めてここで定義する */
    div.mxTooltip { position: absolute; z-index: 1000; pointer-events: none; padding: 4px 8px; font-size: 12px; background: var(--text); color: var(--tooltip-fg); border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.25); white-space: nowrap; }
    .visually-hidden { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <div id="toolbar" role="toolbar">
    <span id="app-name"></span>
    <button id="btn-new" data-i18n="toolbar.new"></button>
    <button id="btn-open" data-i18n="toolbar.open"></button>
    <button id="btn-save" data-i18n="toolbar.save"></button>
    <button id="btn-csv" data-i18n="toolbar.exportCsv"></button>
    <button id="btn-import-csv" data-i18n="toolbar.importCsv"></button>
    <button id="btn-svg" data-i18n="toolbar.exportSvg"></button>
    <button id="btn-png" data-i18n="toolbar.exportPng"></button>
    <button id="btn-checks"></button>
    <button id="btn-undo" data-i18n="toolbar.undo"></button>
    <button id="btn-redo" data-i18n="toolbar.redo"></button>
    <button id="btn-delete" data-i18n="toolbar.delete"></button>
    <span class="zoom-group" role="group">
      <button id="btn-zoom-out" data-i18n="toolbar.zoomOut"></button>
      <button id="btn-zoom-reset" class="zoom-value">100%</button>
      <button id="btn-zoom-in" data-i18n="toolbar.zoomIn"></button>
      <button id="btn-zoom-fit" data-i18n="toolbar.zoomFit"></button>
    </span>
    <label class="toggle"><input type="checkbox" id="chk-grid" /><span data-i18n="toolbar.grid"></span></label>
    <button id="btn-lang" data-i18n="toolbar.language"></button>
    <button id="btn-theme"></button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
  <input type="file" id="file-import-csv" accept=".csv,text/csv" class="visually-hidden" tabindex="-1" />
  <input type="file" id="file-open" accept=".json,application/json" class="visually-hidden" tabindex="-1" />
  <div id="workspace">
    <aside id="palette"></aside>
    <div id="stage">
      <div id="canvas-wrap">
        <div id="graph"></div>
        <div id="legend" aria-label="legend"></div>
      </div>
    </div>
    <aside id="props"></aside>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
